<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>梦想储蓄罐 Dream Jar · 把梦想装进罐子里</title>
<meta name="description" content="梦想储蓄罐（Dream Jar）：一个把储蓄过程与梦想图片可视化结合的个人目标管理网页。存钱越多，玻璃罐越透明，梦想图片越清晰，最终解锁梦想纪念档案。">
<meta name="theme-color" content="#8ea8f0">
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<link rel="apple-touch-icon" href="assets/icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="sky" aria-hidden="true">
  <span class="sky__blob sky__blob--1"></span>
  <span class="sky__blob sky__blob--2"></span>
  <span class="sky__blob sky__blob--3"></span>
  <div class="sky__stars"></div>
</div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/" aria-label="回到首页">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="13" y="16" width="22" height="26" rx="7" stroke="currentColor" stroke-width="2.6"/>
          <path d="M17 16v-2.4a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3V16" stroke="currentColor" stroke-width="2.6"/>
          <ellipse cx="24" cy="30" rx="7" ry="6" stroke="currentColor" stroke-width="2.4"/>
          <path d="M19 30.5c2.2-2.4 7.8-2.4 10 0" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand__text">
        <strong>我的梦想储蓄罐</strong>
        <small>把想去的未来，存进罐子里</small>
      </span>
    </a>

    <nav class="nav" id="nav">
      <a class="nav__item" href="#/" data-nav="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>
        <span>首页</span>
      </a>
      <a class="nav__item" href="#/dreams" data-nav="dreams">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.1 1.2 6L12 16.5 6.6 19.4l1.2-6L3.3 9.3l6.1-.7z"/></svg>
        <span>我的梦想</span>
      </a>
      <a class="nav__item" href="#/completed" data-nav="completed">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7.5 4v5.4c0 4.3-3 7.6-7.5 9.1-4.5-1.5-7.5-4.8-7.5-9.1V7z"/><path d="M8.6 12.2l2.3 2.3 4.4-4.6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>已完成</span>
      </a>
      <a class="nav__item" href="#/settings" data-nav="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-2.6-1.5L14 2.6h-4l-.4 2.4A7.6 7.6 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 2.6 1.5l.4 2.4h4l.4-2.4a7.6 7.6 0 0 0 2.6-1.5l2.4 1 2-3.4z"/></svg>
        <span>设置</span>
      </a>
    </nav>

    <button class="btn btn--primary sidebar__cta" data-action="open-create">
      <span class="plus">+</span> 创建新梦想
    </button>

    <div class="sidebar__foot">
      <p>每一笔存款<br>都是向梦想更近一步</p>
      <span class="sidebar__dots" aria-hidden="true">· ✦ ·</span>
    </div>
  </aside>

  <main class="main" id="view" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar">
    <a href="#/" data-nav="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><span>首页</span></a>
    <a href="#/dreams" data-nav="dreams"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.1 1.2 6L12 16.5 6.6 19.4l1.2-6L3.3 9.3l6.1-.7z"/></svg><span>梦想</span></a>
    <button class="tabbar__fab" data-action="open-create" aria-label="创建新梦想">+</button>
    <a href="#/completed" data-nav="completed"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7.5 4v5.4c0 4.3-3 7.6-7.5 9.1-4.5-1.5-7.5-4.8-7.5-9.1V7z"/></svg><span>已完成</span></a>
    <a href="#/settings" data-nav="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-2.6-1.5L14 2.6h-4l-.4 2.4A7.6 7.6 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 2.6 1.5l.4 2.4h4l.4-2.4a7.6 7.6 0 0 0 2.6-1.5l2.4 1 2-3.4z"/></svg><span>设置</span></a>
  </nav>
</div>

<div id="modal-root" class="modal-root" aria-live="polite"></div>
<div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

<script type="module" src="js/app.js"></script>
<!-- 首次访问的新手引导：关闭后不再出现；网址后加 ?guide=1 可强制再显示一次 -->
<aside class="guide" id="guide" hidden>
  <button class="guide__close" type="button" data-guide="later" aria-label="关闭">✕</button>
  <div class="guide__head">
    <span class="guide__badge">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="13" y="16" width="22" height="26" rx="7" stroke="currentColor" stroke-width="2.6"/>
        <path d="M17 16v-2.4a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3V16" stroke="currentColor" stroke-width="2.6"/>
        <ellipse cx="24" cy="30" rx="7" ry="6" stroke="currentColor" stroke-width="2.4"/>
        <path d="M19 30.5c2.2-2.4 7.8-2.4 10 0" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </span>
    <div>
      <h4>欢迎来到梦想储蓄罐</h4>
      <p>30 秒了解它怎么玩</p>
    </div>
  </div>
  <ol class="guide__steps">
    <li><span>1</span>点「创建新梦想」，写下名称、目标金额，传一张代表梦想的照片</li>
    <li><span>2</span>每存一笔钱就点「存入一笔」记进去，罐子里的水位会升高</li>
    <li><span>3</span>进度越高玻璃越透明，梦想照片也会从模糊变清晰</li>
    <li><span>4</span>存满 100% 时上传实现梦想的照片，它会进入「梦想收藏馆」</li>
  </ol>
  <div class="guide__actions">
    <button class="btn btn--primary btn--sm" type="button" data-guide="done">开始使用</button>
    <button class="btn btn--ghost btn--sm" type="button" data-guide="later">以后再说</button>
  </div>
  <p class="guide__note">示例数据仅供体验，可随时清空；你的记录只保存在本机浏览器里。</p>
</aside>
<script>
  // 第一次打开显示一次：「开始使用」= 以后不再出现，「以后再说」= 下次打开还会出现
  (function () {
    var el = document.getElementById("guide");
    if (!el) return;
    var forced = new URLSearchParams(location.search).get("guide") === "1";
    var seen = localStorage.getItem("dreamjar.guideSeen") === "1";
    var later = sessionStorage.getItem("dreamjar.guideSession") === "1";
    if (!forced && (seen || later)) return;
    setTimeout(function () { el.hidden = false; }, 1200);
    el.addEventListener("click", function (event) {
      var btn = event.target.closest("[data-guide]");
      if (!btn) return;
      if (btn.dataset.guide === "done") localStorage.setItem("dreamjar.guideSeen", "1");
      else sessionStorage.setItem("dreamjar.guideSession", "1");
      el.hidden = true;
    });
  })();
</script>  
</body>
</html>
